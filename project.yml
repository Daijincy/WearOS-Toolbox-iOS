# XcodeGen 工程配置
# CI 中使用: brew install xcodegen && xcodegen generate
name: WearOSBox
options:
  bundleIdPrefix: com.daijincy
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
targets:
  WearOSBox:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WearOSBox
      - path: Vendor/BigInt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daijincy.wearosbox
        INFOPLIST_FILE: WearOSBox/Info.plist
        CODE_SIGN_ENTITLEMENTS: WearOSBox/WearOSBox.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: WearOSBox/WearOSBox-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCAL_NETWORK_USAGE_DESCRIPTION: 用于局域网内连接 WearOS 手表的无线 ADB 调试服务
    scheme:
      testTargets: []
